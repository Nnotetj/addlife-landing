<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ADDLIFE — ออกแบบแผนสุขภาพของคุณ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff; --tile:#f5f5f7; --ink:#1d1d1f; --mut:#6e6e73; --line:#d2d2d7; --hair:#e8e8ed;
  --blue:#0071e3; --blue-h:#0058b0; --link:#0066cc; --plus:#1a7431;
  --tan:#e0b28b; --sky:#9acaed; --green:#cdea9a; --salmon:#f59185;
  --ease:cubic-bezier(.22,1,.36,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Sukhumvit Set",Inter,"Noto Sans Thai",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scrollbar-color:#c7c7cc transparent;-webkit-text-size-adjust:100%}
body{margin:0;font:400 17px/1.6 var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
::selection{background:#b4d5fe}
:focus-visible{outline:3px solid rgba(0,113,227,.6);outline-offset:3px;border-radius:10px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4{font-weight:600;text-wrap:balance}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}
.wrap{max-width:1020px;margin:0 auto;padding:0 22px}
svg.i{width:1em;height:1em;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.8);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--hair)}
.nav .wrap{display:flex;align-items:center;gap:14px;height:52px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.04em;color:var(--ink);font-size:.95rem}
.logo:hover{text-decoration:none}
.sq{display:grid;grid-template-columns:9px 9px;gap:3px}
.sq i{width:9px;height:9px;border-radius:2px}
.sq i:nth-child(1){background:var(--tan)}.sq i:nth-child(2){background:var(--sky)}.sq i:nth-child(3){background:var(--green)}.sq i:nth-child(4){background:var(--salmon)}
.crumbs{display:flex;gap:2px;margin:0 auto;padding:0;list-style:none;font-size:.8rem}
.crumbs a{display:block;padding:6px 11px;border-radius:999px;color:var(--mut)}
.crumbs a:hover{text-decoration:none;color:var(--ink)}
.crumbs a[aria-current]{color:var(--ink);font-weight:600;background:var(--tile)}
.crumbs a.done{color:var(--ink)}
.lang{border:0;background:none;font-size:.8rem;color:var(--mut);padding:6px 8px;border-radius:8px}
.lang:hover{color:var(--ink)}
.bag{display:flex;align-items:center;gap:7px;border:0;background:var(--ink);color:#fff;border-radius:999px;padding:0 14px;height:32px;font-size:.82rem;font-weight:600;transition:transform .3s var(--ease)}
.bag:active{transform:scale(.96)}
.bag b{display:grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#fff;color:var(--ink);font-size:.72rem;font-variant-numeric:tabular-nums}
.bag.bump{animation:bump .5s var(--ease)}
@keyframes bump{40%{transform:scale(1.14)}}
.prog{height:3px;background:transparent}
.prog i{display:block;height:100%;background:var(--blue);border-radius:0 3px 3px 0;transition:width .6s var(--ease)}

/* ---------- step frame ---------- */
main.wrap{padding:44px 22px 150px;min-height:80vh}
.stepin{animation:stepin .6s var(--ease)}
.stepin.back{animation-name:stepback}
@keyframes stepin{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes stepback{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
h1{font-size:clamp(2.1rem,5.4vw,3.4rem);line-height:1.18;letter-spacing:-.012em;max-width:24ch}
h1 span{color:var(--mut);display:block}
.intro{color:var(--mut);font-size:1.12rem;max-width:56ch;margin-top:14px}
.block{margin-top:48px}
.block>h2{font-size:1.55rem;line-height:1.25;letter-spacing:-.008em;margin-bottom:6px}
.block>h2 span{color:var(--mut)}
.hint{color:var(--mut);font-size:.96rem;max-width:64ch;margin-bottom:18px}
.tile{background:var(--tile);border-radius:28px;padding:32px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ref{font-size:.76rem;color:var(--mut);margin-top:14px;line-height:1.45}

/* select tiles (Apple-style options) */
.sel{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1px solid #86868b;border-radius:14px;padding:16px 18px;min-height:64px;font-weight:600;line-height:1.35;transition:border-color .25s,box-shadow .25s,transform .3s var(--ease)}
.sel:hover{border-color:var(--ink)}
.sel:active{transform:scale(.985)}
.sel[aria-pressed=true]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.sel small{display:block;font-weight:400;color:var(--mut);font-size:.86rem;margin-top:2px}
.sel .tick{margin-left:auto;flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:#fff;font-size:.8rem;transition:background .25s,border-color .25s,transform .4s var(--ease)}
.sel[aria-pressed=true] .tick{background:var(--blue);border-color:var(--blue);transform:scale(1.08)}
.sel .tick svg{opacity:0}.sel[aria-pressed=true] .tick svg{opacity:1}

/* step 1 */
.who{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.who .sel{flex-direction:column;align-items:flex-start;padding:22px;min-height:0;font-size:1.25rem;border-radius:20px}
.who svg{width:76px;height:150px;margin-bottom:10px}
.who .tick{position:absolute;right:18px;top:18px}.who .sel{position:relative}
.score{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.score output{font-size:clamp(4.5rem,12vw,6rem);font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;min-width:1.2ch}
.score h3{font-size:1.5rem;line-height:1.25}
.score h3 small{display:block;font-weight:400;color:var(--mut);font-size:1rem}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;touch-action:pan-y;background:none;margin:18px 0 0;cursor:grab}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(90deg,#f59185,#e0b28b 35%,#cdea9a 65%,#9acaed)}
input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:linear-gradient(90deg,#f59185,#e0b28b 35%,#cdea9a 65%,#9acaed)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:-12px;border-radius:50%;background:#fff;border:.5px solid rgba(0,0,0,.08);box-shadow:0 3px 10px rgba(0,0,0,.22),0 1px 2px rgba(0,0,0,.12)}
input[type=range]::-moz-range-thumb{width:32px;height:32px;border-radius:50%;background:#fff;border:.5px solid rgba(0,0,0,.08);box-shadow:0 3px 10px rgba(0,0,0,.22)}
.ticks{display:flex;justify-content:space-between;font-size:.78rem;color:var(--mut);padding:0 12px;font-variant-numeric:tabular-nums}
.pts{list-style:none;padding:0;margin:18px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.pts li{background:#fff;border-radius:999px;padding:5px 14px;font-size:.92rem}
.callout{margin-top:16px;font-size:.98rem;color:var(--ink);background:#fff;border-radius:16px;padding:14px 18px}
.bands{display:grid;grid-template-columns:1fr 1.2fr 2fr 1.2fr 1fr;gap:4px;margin-top:6px}
.bands button{border:0;border-radius:12px;padding:16px 4px;font-size:.8rem;font-weight:600;line-height:1.25;background:var(--salmon);color:#3b1410;opacity:.5;transition:opacity .3s,transform .4s var(--ease)}
.bands button:nth-child(2),.bands button:nth-child(4){background:var(--tan);color:#3b2410}.bands button:nth-child(3){background:var(--green);color:#1f3305}
.bands button[aria-pressed=true]{opacity:1;transform:translateY(-6px)}
.brace{margin:8px calc(100%/6.4) 0;border-top:1.5px solid var(--mut);text-align:center;font-size:.8rem;color:var(--mut);padding-top:5px}

/* step 2 */
.pick{display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:16px;align-items:start}
.map{position:sticky;top:72px;padding:18px 10px}
.map svg{width:100%;height:auto;display:block}
.fig{fill:#cfdfee}.limb{fill:none;stroke:#cfdfee;stroke-linecap:round;stroke-linejoin:round}.hair{fill:#3a4a5c}
.zone{cursor:pointer}
.zone .lead-l{fill:none;stroke:#b6bcc6;stroke-width:1.2}
.zone .dot{fill:#fff;stroke:var(--blue);stroke-width:3;transition:fill .25s}
.zone .ring{fill:none;stroke:var(--blue);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.zone .hitz{fill:transparent}
.zone .pill{fill:#fff;stroke:transparent;stroke-width:1.5;transition:fill .25s,stroke .25s}
.zone text{font:600 14.5px var(--font);fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.zone:hover .pill{stroke:var(--ink)}
.zone.on .pill{fill:var(--blue)}.zone.on text{fill:#fff}.zone.on .dot{fill:var(--blue)}.zone.on .lead-l{stroke:var(--blue)}
.zone.on .ring{animation:ring 1.8s var(--ease) infinite}
@keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
.zone:focus-visible{outline:none}.zone:focus-visible .pill{stroke:var(--ink);stroke-width:3}
.opts{display:grid;gap:10px}
.opts h3{font-size:.9rem;color:var(--mut);font-weight:600;margin:14px 0 0}.opts h3:first-child{margin-top:0}
.grp{margin-top:40px}.grp>h2{font-size:1.35rem}.grp .hint{margin-bottom:14px}
.flow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px}
.flow h3{font-size:1.05rem;margin-bottom:10px}
.flow ul{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}
.flow li{background:#fff;border-radius:999px;padding:4px 13px;font-size:.9rem;transition:background .35s,color .35s,transform .5s var(--ease)}
.flow li.hot{background:var(--ink);color:#fff;transform:scale(1.04)}
.flow h4{font-size:.86rem;color:var(--mut);font-weight:500;margin:12px 0 6px}

/* step 3 */
.levels{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.levels .sel{flex-direction:column;align-items:flex-start;gap:2px;padding:12px 12px 14px;min-height:92px;font-size:.92rem}
.levels .sel b{font-size:1.5rem;font-weight:600;line-height:1.1;color:var(--mut);font-variant-numeric:tabular-nums}
.levels .sel[aria-pressed=true] b{color:var(--blue)}
.levels .sel em{font-style:normal;font-size:.72rem;font-weight:600;color:var(--blue);margin-top:auto}
.lv{margin-top:16px}
.lv h3{font-size:1.75rem;line-height:1.2;letter-spacing:-.01em}
.lv>p{color:var(--mut);margin-top:6px;max-width:60ch}
.g{display:grid;grid-template-columns:240px minmax(0,1fr);gap:2px 24px;padding:13px 0;border-top:1px solid var(--line)}
.g:first-of-type{margin-top:22px}
.g h4{font-size:.98rem}
.g p{color:#424245;font-size:.97rem}
.g ins{text-decoration:none;font-weight:600;color:var(--plus)}
.pillb{display:inline-block;font-size:.72rem;font-weight:600;border-radius:999px;padding:1px 9px;margin-left:8px;background:#e3efff;color:#004a99;vertical-align:middle;white-space:nowrap}
.more{margin-top:4px}
.more>summary{color:var(--link);padding:14px 0;border-top:1px solid var(--line)}

/* prices & program picker */
.pr{white-space:nowrap;font-variant-numeric:tabular-nums}
.pr s{color:var(--mut);font-weight:400;font-size:.88em;margin-right:2px}
.pr b{font-weight:600;color:var(--ink)}
.prl{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-top:10px}
.prl .pr b{font-size:1.5rem;letter-spacing:-.01em}
.prl>span:not(.pr){font-size:.86rem;color:var(--mut)}
.card .prl{margin-top:2px}.card .prl .pr b{font-size:1.15rem}
.card h3 small .pr b{color:var(--ink)}
.ages{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.fam{margin-bottom:22px}
.fam .sel{font-size:1.08rem;border-radius:18px;padding:18px 20px}
.levels.v4{grid-template-columns:repeat(4,1fr)}
.levels .sel small{font-size:.76rem;margin-top:3px}
.swipe{display:none;align-items:center;gap:4px;font-size:.84rem;font-weight:600;color:var(--blue);margin:0 0 8px}
.swipe svg{animation:nudge 1.6s var(--ease) infinite}
@keyframes nudge{50%{transform:translateX(5px)}}
.lvt{font-size:1.05rem;margin:18px 0 8px}.lvt span{color:var(--mut);font-weight:400;font-size:.92rem;margin-left:6px}
.lvh{display:flex;gap:16px 24px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.lvh>div{flex:1 1 320px;min-width:0}.lvh>div>p:not(.prl){color:var(--mut);margin-top:6px;max-width:60ch}
.lvh .btn{flex:none}.lvh .btn.soft{background:#fff}
.lvh+.g{margin-top:22px}
.g .it{display:block;padding:2px 0}.g .it i{font-style:normal;color:var(--mut);font-size:.9em}
.prep{margin-top:16px;background:var(--tile);padding:16px 20px;border-radius:18px}.prep ul{padding-left:18px;margin-top:6px}
.sub .row{display:flex;align-items:flex-start;gap:10px;border-top:1px solid var(--line)}
.sub .row details,.sub .row .rw{flex:1 1 auto;min-width:0;border:0}
.sub .row summary span:first-child,.sub .rw span:first-child{flex:1 1 auto;min-width:0}
.sub .row summary{gap:10px}
.sub .rw{display:flex;align-items:center;gap:10px;min-height:44px;padding:11px 0;font-weight:600;font-size:.95rem;color:var(--ink)}
.sub .row .add{width:32px;height:32px;font-size:.9rem;margin-top:8px}
.ivp{display:flex;flex-direction:column;gap:2px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line);font-size:.88rem!important;color:var(--mut)!important}
.ivp span{display:flex;justify-content:space-between;gap:10px}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-top:20px;padding:16px 18px;background:var(--tile);border-radius:16px;font-weight:600}
.total small{display:block;font-weight:400;color:var(--mut);font-size:.82rem}.total b{font-size:1.35rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.sh-body li .lp{margin-left:auto;text-align:right;font-size:.92rem}.sh-body li .lp+.x{margin-left:0}

/* cards (steps 3–5) */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chips button{border:0;background:var(--tile);border-radius:999px;padding:0 16px;height:38px;font-size:.92rem;font-weight:500;white-space:nowrap;transition:background .25s,color .25s}
.chips button:hover{background:var(--hair)}
.chips button[aria-pressed=true]{background:var(--ink);color:#fff}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cards.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--tile);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:8px;transition:background .3s,box-shadow .3s}
.card.added{background:#fff;box-shadow:inset 0 0 0 2px var(--blue)}
.card header{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.card h3{font-size:1.14rem;line-height:1.3}
.card h3 small{display:block;font-size:.86rem;font-weight:400;color:var(--mut);margin-top:3px}
.card p{font-size:.95rem;color:#424245}
.card ul{margin:0;padding-left:18px;font-size:.93rem;color:#424245}
.card .pillb{margin:0;align-self:flex-start}
.add{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:#e3e3e8;color:var(--ink);display:grid;place-items:center;font-size:1.05rem;transition:background .25s,color .25s,transform .45s var(--ease)}
.add:hover{background:#d5d5db}
.add:active{transform:scale(.88)}
.add .i-check{display:none}
.add[aria-pressed=true]{background:var(--blue);color:#fff;transform:rotate(360deg)}
.add[aria-pressed=true] .i-plus{display:none}.add[aria-pressed=true] .i-check{display:block}
details summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;min-height:44px;font-weight:500;color:var(--link);font-size:.95rem}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"";width:7px;height:7px;border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .35s var(--ease)}
details[open] summary::after{transform:translateY(2px) rotate(225deg)}
details .body{padding-top:12px;font-size:.94rem;color:#424245}
details .body p{margin-bottom:8px}
.kv b{color:var(--ink);font-weight:600}
.note{background:#fff;border-radius:14px;padding:12px 16px;font-size:.9rem;margin-top:6px}
.note ul{margin:4px 0 0}
.cols{columns:2 200px;column-gap:20px;font-size:.9rem}
.cols div{break-inside:avoid;margin-bottom:10px}
.symp{list-style:none;padding:0!important;margin:4px 0 10px}
.symp label{display:flex;gap:10px;align-items:flex-start;padding:9px 0;cursor:pointer}
.symp input{width:22px;height:22px;margin-top:2px;accent-color:var(--blue);flex:none}
.sub details{border-top:1px solid var(--line)}
.sub details summary{color:var(--ink);font-weight:600;padding:11px 0;justify-content:space-between}
.sub details .body{padding:0 0 12px}
.rowbtn{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border-radius:999px;border:0;background:var(--blue);color:#fff;font-weight:500;transition:background .25s,transform .3s var(--ease)}
.btn:hover{background:var(--blue-h);text-decoration:none}.btn:active{transform:scale(.97)}
.btn.soft{background:var(--tile);color:var(--link)}.btn.soft:hover{background:var(--hair)}
.empty{color:var(--mut);padding:30px 0}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(255,255,255,.86);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom)}
.dock .wrap{display:flex;align-items:center;gap:14px;height:72px}
.dock .back{border:0;background:none;color:var(--link);font-weight:500;padding:10px 6px;display:flex;align-items:center;gap:4px}
.dock .back[disabled]{visibility:hidden}
.dock p{margin:0 auto;font-size:.86rem;color:var(--mut);text-align:center;line-height:1.3}
.dock p b{display:block;color:var(--ink);font-weight:600;font-size:.95rem}
.dock .btn{min-width:132px}

/* sheet */
dialog{border:0;padding:0;background:#fff;color:var(--ink);width:min(680px,100%);max-width:100%;max-height:min(86vh,900px);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.28),0 4px 16px rgba(0,0,0,.12);overflow:hidden}
dialog[open]{display:flex;flex-direction:column;animation:sheet .55s var(--ease)}
dialog::backdrop{background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
@keyframes sheet{from{opacity:0;transform:translateY(60px) scale(.98)}to{opacity:1;transform:none}}
.sh-head,.sh-foot{flex:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:22px 26px 14px;border-bottom:1px solid var(--hair)}
.sh-head h2{font-size:1.5rem}
.x{width:40px;height:40px;border-radius:50%;border:0;background:var(--tile);display:grid;place-items:center;font-size:.95rem;color:var(--mut)}
.x:hover{background:var(--hair);color:var(--ink)}
.sh-body{overflow:auto;flex:1 1 auto;min-height:0;-webkit-overflow-scrolling:touch;padding:8px 26px 22px}
.sh-body h3{font-size:.86rem;font-weight:600;color:var(--mut);margin:20px 0 4px}
.sh-body ul{list-style:none;padding:0;margin:0}
.sh-body li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--hair);font-weight:500}
.sh-body li small{display:block;font-weight:400;color:var(--mut);font-size:.86rem}
.sh-body li .x{margin-left:auto;width:40px;height:40px;font-size:.82rem;flex:none}
.sh-foot{padding:16px 26px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--hair);display:flex;gap:10px;flex-wrap:wrap}
.sh-msg{flex:1 1 100%;font-size:.88rem;color:var(--ink);background:var(--tile);border-radius:12px;padding:10px 14px}.sh-msg:empty{display:none}
dialog.nomodal{position:fixed;inset:auto 0 0 0;margin:0 auto;z-index:60}
#printout{display:none}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:900px){
  .crumbs{display:none}.logo{margin-right:auto}
  .pick{grid-template-columns:1fr}.map{position:static;max-width:480px;margin:0 auto;width:100%;order:2}
  .grid2,.cards,.cards.c3,.flow{grid-template-columns:1fr}
  .ages{grid-template-columns:1fr 1fr}
  .levels.v4{display:flex}
  .lvt{margin-bottom:4px}

  .swipe{display:flex}
  .g{grid-template-columns:1fr}
  .tile{padding:24px 20px;border-radius:24px}
  main.wrap{padding-top:30px}
}
@media (max-width:600px){
  dialog{position:fixed;inset:auto 0 0 0;margin:0;border-radius:24px 24px 0 0;width:100%;max-width:100%;max-height:86vh;max-height:86dvh}
  .sh-foot .btn{flex:1 1 auto}
  .add{width:44px;height:44px}.sub .row .add{width:40px;height:40px;margin-top:4px}
  .sub .row summary,.sub .rw{flex-wrap:wrap;gap:0 10px}
  .lang{min-width:44px;min-height:44px}.bag{height:40px}
  .chips button{height:44px}
  .dock p span{display:none}.dock .btn{min-width:116px}
  .who .sel{font-size:1.05rem;padding:16px}
}
@media print{
  body>*:not(#printout){display:none!important}
  #printout{display:block;padding:0 4mm;font-size:11pt}
  #printout h1{font-size:20pt;max-width:none;margin-bottom:6pt}
  #printout h3{font-size:9pt;font-weight:600;color:#555;margin:14pt 0 2pt;text-transform:none}
  #printout ul{list-style:none;padding:0;margin:0}
  #printout li{padding:6pt 0;border-bottom:.5pt solid #ccc;font-weight:500;break-inside:avoid}
  #printout li small{display:block;font-weight:400;color:#555;font-size:9.5pt}
  #printout .x,#printout a{display:none}

  #printout .total{display:flex;justify-content:space-between;align-items:center;margin-top:14pt;padding:10pt 14pt;border:.75pt solid #c7c7cc;border-radius:10pt;background:#f5f5f7;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-weight:600;break-inside:avoid}
  #printout .total small{display:block;font-weight:400;font-size:8.5pt;color:#555}
  #printout .disc{margin-top:14pt;font-size:8.5pt;color:#555}
}

    ${sec(T('ตัวคุณ','You'),[`<li><span>${T(S.g==='m'?'ผู้ชาย':'ผู้หญิง',S.g==='m'?'Men':'Lady')}${S.age!==null?' · '+T('อายุ ','Age ')+L(AGES[S.age]):''}<small>${T('คะแนนสุขภาพที่ให้ตัวเอง','Self-rated health')} ${S.cont}/10 · ${L(st.zone)}</small></span></li>`])}
    ${sec(T('เรื่องที่กังวล','Your concerns'),sel.map(c=>`<li><span>${L(c.n)}<small>${c.roots.map(r=>L(CAUSES.decl[r])).join(' · ')}</small></span>${rm('c',c.id,L(c.n))}</li>`))}
    ${sel.length?'':`<p class="disc" style="margin-top:14px">${T('ยังไม่ได้เลือกเรื่องที่กังวล','No concerns selected yet.')} <a href="#2" data-act="close">${T('ไปขั้นที่ 2','Go to step 2')}</a></p>`}
    ${sec(T('ตรวจ','Test'),by(3))}
    ${sec(T('เจาะลึก','Go deeper'),by(4))}
    ${sec(T('ดูแล','Care'),by(5))}
    ${items.length?`<p class="total"><span>${T('ยอดรวมโดยประมาณ','Estimated total')}<small>${T('คิดจากราคาโปรโมชัน · IV และหัตถการคิดที่ 1 ครั้ง','Based on promotion prices · IV and treatments counted as 1 session')}</small></span><b>${fmt(total)} ฿</b></p>`:`<p class="disc" style="margin-top:14px">${T('ยังไม่มีรายการในแผน','Nothing in your plan yet.')} <a href="#3" data-act="close">${T('ไปเลือกโปรแกรมในขั้นที่ 3','Choose a program in step 3')}</a></p>`}
    <p class="disc">${T('หน้านี้เป็นข้อมูลเบื้องต้นเพื่อประกอบการตัดสินใจ ไม่ใช่การวินิจฉัยโรค การจับคู่เรื่องที่กังวลกับรายการตรวจเป็นเพียงแนวทาง การเลือกโปรแกรม การแปลผล และการรักษาต้องทำร่วมกับแพทย์ · ราคาอาจเปลี่ยนแปลงได้โดยไม่ต้องแจ้งให้ทราบล่วงหน้า · อ้างอิงเนื้อหาจาก Addlife Anti-Aging Program และ AddLife Health Check-Up Program (อัปเดต 25 ก.ย. 2026)','This is introductory information, not a diagnosis. Links between concerns and tests are a guide only; program choice, interpretation and treatment must be decided with a physician. · Prices may change without prior notice. · Content based on Addlife Anti-Aging Program and AddLife Health Check-Up Program (update 25 Sep 2026).')}</p></div>
   <div class="sh-foot"><p class="sh-msg" id="sh-msg" role="status"></p><button class="btn" data-act="print">${T('พิมพ์ / บันทึกเป็น PDF','Print / save as PDF')}</button><button class="btn soft" data-act="share">${navigator.share?T('แชร์แผน','Share plan'):T('คัดลอกแผน','Copy plan')}</button><button class="btn soft" data-act="reset">${T('เริ่มใหม่','Start over')}</button></div>`;
}

/* ================= PRINT / SHARE ================= */
const msg=t=>{const m=$('#sh-msg');if(m)m.textContent=t;};
function openSheet(){const d=$('#sheet');rSheet();if(d.open)return;
  if(typeof d.showModal==='function'){try{d.showModal();return;}catch(e){}}
  d.classList.add('nomodal');d.setAttribute('open','');}
function closeSheet(){const d=$('#sheet');if(typeof d.close==='function'&&d.open){try{d.close();return;}catch(e){}}d.removeAttribute('open');}
function planText(){
  const sel=CONCERNS.filter(c=>S.cs.has(c.id)),items=[...S.adds].map(ITEM).filter(Boolean),st=stage(),by=s=>items.filter(i=>i.s===s).map(i=>'- '+i.n+(i.pr?' — '+fmt(now(i.pr))+' ฿':'')),total=items.reduce((a,i)=>a+now(i.pr),0);
  const sec=(t,rows)=>rows.length?['',t].concat(rows):[];
  return [T('แผนสุขภาพของฉัน (ADDLIFE)','My health plan (ADDLIFE)'),
    T(S.g==='m'?'ผู้ชาย':'ผู้หญิง',S.g==='m'?'Men':'Lady')+(S.age!==null?' · '+T('อายุ ','Age ')+L(AGES[S.age]):'')+' · '+T('คะแนนสุขภาพ','Self-rated health')+' '+S.cont+'/10 ('+L(st.zone)+')']
    .concat(sec(T('เรื่องที่กังวล','Concerns'),sel.map(c=>'- '+L(c.n))))
    .concat(sec(T('ตรวจ','Test'),by(3)))
    .concat(sec(T('เจาะลึก','Go deeper'),by(4)))
    .concat(sec(T('ดูแล','Care'),by(5)))
    .concat(items.length?['',T('ยอดรวมโดยประมาณ','Estimated total')+': '+fmt(total)+' ฿']:[])
    .concat(['',T('ข้อมูลเบื้องต้น ไม่ใช่การวินิจฉัยโรค ควรปรึกษาแพทย์','Introductory information, not a diagnosis. Please consult a physician.')]).join('\n');
}
function doPrint(){
  rSheet();
  $('#printout').innerHTML='<h1>'+T('แผนสุขภาพของคุณ','Your health plan')+'</h1>'+$('#sheet .sh-body').innerHTML;
  let fired=false;const on=()=>{fired=true;};
  window.addEventListener('beforeprint',on,{once:true});
  try{window.print();}catch(e){}
  setTimeout(()=>{window.removeEventListener('beforeprint',on);
    if(!fired)msg(T('ถ้าหน้าพิมพ์ไม่เปิดขึ้น แสดงว่าแอปนี้ไม่รองรับการพิมพ์ ให้เปิดหน้านี้ใน Safari หรือ Chrome โดยตรง หรือกด “'+(navigator.share?'แชร์แผน':'คัดลอกแผน')+'” เพื่อส่งแผนเป็นข้อความ','If the print screen did not open, this app does not support printing. Open this page in Safari or Chrome directly, or use “'+(navigator.share?'Share plan':'Copy plan')+'” to send the plan as text.'));},1500);
}
async function doShare(){
  const text=planText();
  if(navigator.share){try{await navigator.share({title:'ADDLIFE',text});return;}catch(e){if(e&&e.name==='AbortError')return;}}
  let ok=false;
  try{await navigator.clipboard.writeText(text);ok=true;}catch(e){
    const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:0;top:0;opacity:0';
    $('#sheet').appendChild(ta);ta.select();ta.setSelectionRange(0,text.length);try{ok=document.execCommand('copy');}catch(e2){}ta.remove();}
  msg(ok?T('คัดลอกแผนแล้ว วางในแชตหรือโน้ตได้เลย','Plan copied. Paste it into a chat or note.'):T('คัดลอกไม่สำเร็จ ลองเปิดหน้านี้ใน Safari หรือ Chrome','Could not copy. Try opening this page in Safari or Chrome.'));
}

/* ================= RENDER ================= */
let lastStep=0;
function render(keep){
  const s=step(),open=keep?[...document.querySelectorAll('#view details[open]')].map(d=>d.id):[];
  const sl=keep?[...document.querySelectorAll('#view .levels')].map(e=>e.scrollLeft):[];
  document.documentElement.lang=S.lang;
  document.title=T('ADDLIFE — ออกแบบแผนสุขภาพของคุณ','ADDLIFE — Design your health plan');
  rNav();rDock();
  const v=$('#view');
  v.innerHTML=`<div class="${keep?'':'stepin'+(s<lastStep?' back':'')}">${[r1,r2,r3,r4,r5][s-1]()}</div>`;
  open.forEach(id=>{const d=document.getElementById(id);if(d)d.open=true;});
  const lv=[...document.querySelectorAll('#view .levels')];
  lv.forEach((e,i)=>{if(e.scrollWidth<=e.clientWidth)return;
    if(sl.length===lv.length){e.scrollLeft=sl[i];return;}
    const p=e.querySelector('[aria-pressed=true]');if(p)e.scrollLeft=Math.max(0,p.getBoundingClientRect().left-e.getBoundingClientRect().left+e.scrollLeft-22);});
  if(s===3)rSym();
  if($('#sheet').open)rSheet();
  lastStep=s;
}
function bump(){const b=$('#bag');if(!b)return;b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');}

/* ================= EVENTS ================= */
function act(el){
  const a=el.dataset.act,v=el.dataset.v;let b=false;
  if(a==='lang')S.lang=S.lang==='th'?'en':'th';
  else if(a==='g'){S.g=v;S.sym.clear();}
  else if(a==='age'){S.age=S.age===+v?null:+v;if(!S.hcSet)S.hc=S.age??0;}
  else if(a==='fam')S.fam=v;
  else if(a==='hcl'){S.hc=+v;S.hcSet=true;}
  else if(a==='c'){S.cs.has(v)?S.cs.delete(v):S.cs.add(v);if(!S.tierSet){const r=recTier();S.tier=r>=0?r:0;}S.f4=S.f5=null;}
  else if(a==='tier'){S.tier=+v;S.tierSet=true;}
  else if(a==='rng'){S.rng=+v;}
  else if(a==='f4')S.f4=v;
  else if(a==='f5')S.f5=v;
  else if(a==='add'){S.adds.has(v)?S.adds.delete(v):(S.adds.add(v),b=true);}
  else if(a==='addall'){const ids=(v==='lab'?allLabs().filter(l=>hit(l.c)).map(l=>'lab:'+l.id):IV.filter(x=>hit(x.c)).map(x=>'iv:'+x.id));
    const all=ids.every(x=>S.adds.has(x));ids.forEach(x=>all?S.adds.delete(x):S.adds.add(x));b=!all;}
  else if(a==='go'){location.hash='#'+v;return;}
  else if(a==='sheet'){openSheet();return;}
  else if(a==='close'){closeSheet();return;}
  else if(a==='print'){doPrint();return;}
  else if(a==='share'){doShare();return;}
  else if(a==='reset'){S.cs.clear();S.adds.clear();S.sym.clear();S.tier=0;S.tierSet=false;S.hc=0;S.hcSet=false;S.age=null;S.fam='hc';S.cont=5;S.f4=S.f5=null;save();closeSheet();if(step()===1)render(false);else location.hash='#1';return;}
  else return;
  save();render(true);if(b)bump();
  if(['add','c','tier','hcl','fam','age'].includes(a)){const again=document.querySelector(`[data-act="${a}"][data-v="${v}"]`);if(again&&!$('#sheet').open)again.focus({preventScroll:true});}
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&el.tagName!=='INPUT')act(el);
  if(e.target===$('#sheet'))closeSheet();});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const el=e.target.closest('.zone');if(el){e.preventDefault();act(el);}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.act!=='cont')return;S.cont=+el.value;$('#cnum').textContent=S.cont;$('#cstw').innerHTML=contHTML();$('#cex').innerHTML=contExtra();save();});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.act==='sym'){const k=+el.dataset.v;el.checked?S.sym.add(k):S.sym.delete(k);rSym();}});
window.addEventListener('hashchange',()=>{closeSheet();render(false);window.scrollTo(0,0);});
if(!S.tierSet){const r=recTier();if(r>=0)S.tier=r;}
if(!S.hcSet&&S.age!==null)S.hc=S.age;
render(false);
</script>
</body>
